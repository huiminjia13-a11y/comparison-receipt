<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14120f">
  <meta name="color-scheme" content="dark">
  <title>今晚的比较小票</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true">声音 开</button>
  <div id="app" data-screen="landing">
    <header class="mast">夜间比较受理处</header>

    <section class="screen" data-screen="landing" aria-labelledby="landing-title">
      <p class="kicker">不是测试 · 不算命</p>
      <h1 id="landing-title">今晚的比较小票</h1>
      <p class="lede">把你刚才那口比较打成一张热敏小票，然后归档，或撕掉。</p>
      <div class="hero-slip" aria-hidden="true">
        <span class="hero-rule"></span>
        <span>对象　　某个「同龄人」</span>
        <span>合计　　注意力 × 1</span>
        <span class="hero-rule"></span>
        <span class="hero-total">已付，无法退款</span>
      </div>
      <button type="button" class="btn primary" id="btn-start">开始打票</button>
      <button type="button" class="btn ghost" id="btn-open-drawer">本周抽屉</button>
      <p class="fine">只存在这台设备上。没有账号。</p>
      <p class="disclaimer">不是心理咨询、不算命、不保证心情变好。</p>
    </section>

    <section class="screen" data-screen="form" aria-labelledby="form-title">
      <h1 id="form-title" class="screen-title">打票</h1>

      <fieldset>
        <legend>你刚才在和谁比？</legend>
        <div class="chips" id="who-chips" role="radiogroup" aria-label="比较对象"></div>
        <label class="field">
          <span>写一下是谁（可不填）</span>
          <input id="who-name" type="text" maxlength="20" placeholder="名字、称呼，或不写" autocomplete="off" lang="zh-CN" inputmode="text" spellcheck="false" enterkeyhint="done">
          <div class="suggest-chips" id="who-name-suggest" data-for="who-name" aria-label="常用称呼"></div>
        </label>
        <label class="field">
          <span>对方有什么（可不填）</span>
          <input id="they-have" type="text" maxlength="40" placeholder="房子 / 签证 / 对象 / 看起来很确定的人生" autocomplete="off" lang="zh-CN" inputmode="text" spellcheck="false" enterkeyhint="done">
          <div class="suggest-chips" id="they-have-suggest" data-for="they-have" aria-label="常用词"></div>
        </label>
      </fieldset>

      <label class="field">
        <span>这一口比较，你此刻的感觉（必填，填了才能打印）</span>
        <input id="feeling" type="text" maxlength="40" placeholder="酸、空、来不及、说不清……随便写一行" autocomplete="off" lang="zh-CN" inputmode="text" spellcheck="false" enterkeyhint="done">
        <div class="suggest-chips" id="feeling-suggest" data-for="feeling" aria-label="常用感觉"></div>
        <div class="pinyin-box" id="feeling-pinyin" hidden>
          <p class="pinyin-tip">拼音候选（离线）· 点一下填入</p>
          <div class="suggest-chips" id="feeling-pinyin-list" role="listbox" aria-label="拼音候选"></div>
        </div>
        <p class="cjk-tip">云桌面若没有中文输入法：点上面的词，或手机打好再粘贴进来。</p>
      </label>

      <fieldset>
        <legend>这口比较在你身上停了多久？</legend>
        <div class="chips" id="duration-chips" role="radiogroup" aria-label="停留多久"></div>
      </fieldset>

      <button type="button" class="btn primary is-wait" id="btn-print" aria-disabled="true">先写感觉</button>
      <p class="print-hint" id="print-hint" hidden>写一个词就行，比如：酸</p>
      <button type="button" class="btn ghost" id="btn-form-back">返回</button>
      <p class="disclaimer">不打分。不解释你是哪种人。</p>
    </section>

    <section class="screen" data-screen="ticket" aria-live="polite">
      <div class="stage">
        <div class="printer" id="printer" aria-hidden="true">
          <div class="printer-top">
            <span class="led" id="led"></span>
            <span class="printer-label">THERMAL</span>
          </div>
          <div class="printer-slot"></div>
        </div>
        <p class="print-status" id="print-status">出票中</p>
        <div class="receipt-stage" id="receipt-stage">
          <article class="receipt" id="receipt"></article>
        </div>
      </div>
      <div class="actions" id="ticket-actions" hidden>
        <button type="button" class="btn primary" id="btn-archive">归档</button>
        <button type="button" class="btn danger" id="btn-tear">撕掉</button>
      </div>
    </section>

    <section class="screen" data-screen="after" aria-labelledby="after-title">
      <h1 id="after-title" class="screen-title"></h1>
      <p class="lede" id="after-copy"></p>
      <button type="button" class="btn primary" id="btn-again">再打一张</button>
      <button type="button" class="btn ghost" id="btn-after-drawer">看本周抽屉</button>
      <button type="button" class="btn ghost" id="btn-share-ticket" hidden>分享今晚的账单</button>
    </section>

    <section class="screen" data-screen="drawer" aria-labelledby="drawer-title">
      <h1 id="drawer-title" class="screen-title">本周抽屉</h1>
      <article class="settle" id="settle-slip" aria-label="本周结算单"></article>
      <ul class="drawer-list" id="drawer-list"></ul>
      <button type="button" class="btn primary" id="btn-drawer-new">打一张</button>
      <button type="button" class="btn ghost" id="btn-drawer-home">回入口</button>
      <p class="disclaimer">只列归档过的票。撕掉的只计数、不留内容。</p>
    </section>
  </div>

  <aside id="pet" class="pet" data-mood="idle" data-pose="loaf" aria-hidden="true">
    <svg viewBox="0 0 168 108" class="pet-svg" role="img">
      <defs>
        <linearGradient id="lihua-fur" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c9a56a"/>
          <stop offset="45%" stop-color="#b08a4e"/>
          <stop offset="100%" stop-color="#8f6d3d"/>
        </linearGradient>
        <linearGradient id="lihua-fur-dark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a67d45"/>
          <stop offset="100%" stop-color="#7a5a32"/>
        </linearGradient>
      </defs>
      <!-- 中华田园猫 / 狸花：灰黄底、深褐虎斑、琥珀眼、瘦长、警惕耳 -->
      <g class="pose-loaf">
        <path class="pet-tail" d="M28 78 C6 74 -2 52 14 40 C22 34 28 44 24 52" fill="none" stroke="#3a2418" stroke-width="8.5" stroke-linecap="round"/>
        <path d="M28 78 C6 74 -2 52 14 40 C22 34 28 44 24 52" fill="none" stroke="#b8955c" stroke-width="3.2" stroke-linecap="round"/>
        <!-- 瘦长身子 -->
        <ellipse class="pet-body" cx="82" cy="76" rx="54" ry="17" fill="url(#lihua-fur)"/>
        <ellipse cx="82" cy="72" rx="48" ry="12" fill="#c4a060" opacity="0.35"/>
        <!-- 深褐虎斑 -->
        <g class="pet-stripes" fill="none" stroke="#3a2418" stroke-width="3.4" stroke-linecap="round" opacity="0.92">
          <path d="M48 64 q6 14 0 24"/>
          <path d="M62 61 q7 16 0 28"/>
          <path d="M76 60 q7 17 0 30"/>
          <path d="M90 61 q6 16 0 26"/>
          <path d="M104 64 q5 13 0 20"/>
          <path d="M54 70 q4 8 0 14" stroke-width="2"/>
          <path d="M84 68 q4 10 0 16" stroke-width="2"/>
        </g>
        <!-- 白胸口 + 爪尖 -->
        <ellipse cx="108" cy="86" rx="14" ry="9" fill="#e8e0d2" opacity="0.92"/>
        <ellipse cx="118" cy="90" rx="9" ry="5" fill="#efe8dc"/>
        <ellipse cx="62" cy="91" rx="8" ry="4.5" fill="#efe8dc"/>
        <ellipse cx="48" cy="88" rx="7" ry="4" fill="#efe8dc" opacity="0.85"/>
        <!-- 头：略尖、警惕 -->
        <g class="pet-head-group">
          <ellipse cx="126" cy="48" rx="21" ry="19" fill="url(#lihua-fur-dark)"/>
          <!-- M 字额纹 -->
          <path d="M114 36 L118 46 L126 35 L134 46 L138 36" fill="none" stroke="#2e1c12" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M112 50 q8 2 7 11" fill="none" stroke="#3a2418" stroke-width="1.8"/>
          <path d="M140 50 q-8 2 -7 11" fill="none" stroke="#3a2418" stroke-width="1.8"/>
          <g class="pet-ear-l">
            <path d="M108 40 L106 16 L122 36 Z" fill="#a67d45"/>
            <path d="M110 36 L109 20 L118 34 Z" fill="#6b3d2e"/>
            <path d="M112 26 v7" stroke="#2e1c12" stroke-width="1.4"/>
          </g>
          <g class="pet-ear-r">
            <path d="M132 34 L150 12 L148 40 Z" fill="#a67d45"/>
            <path d="M136 32 L145 16 L144 36 Z" fill="#6b3d2e"/>
            <path d="M140 22 v8" stroke="#2e1c12" stroke-width="1.4"/>
          </g>
          <!-- 琥珀 / 铜眼 -->
          <g class="pet-eye pet-eye-l">
            <ellipse cx="118" cy="50" rx="4.6" ry="5.1" fill="#c97818"/>
            <ellipse cx="118.5" cy="50.2" rx="1.6" ry="3.4" fill="#1a120c"/>
            <circle cx="116.8" cy="48.4" r="0.9" fill="#f0d9a0" opacity="0.55"/>
          </g>
          <g class="pet-eye pet-eye-r">
            <ellipse cx="136" cy="49" rx="4.6" ry="5.1" fill="#c97818"/>
            <ellipse cx="136.5" cy="49.2" rx="1.6" ry="3.4" fill="#1a120c"/>
            <circle cx="134.8" cy="47.4" r="0.9" fill="#f0d9a0" opacity="0.55"/>
          </g>
          <ellipse cx="127" cy="58" rx="2.2" ry="1.5" fill="#8a4a3a"/>
          <path d="M127 59.5 L127 62" stroke="#2e1c12" stroke-width="1.1"/>
          <path d="M118 62 q9 4 18 0" fill="none" stroke="#2e1c12" stroke-width="1" opacity="0.55"/>
        </g>
      </g>
      <g class="pose-back">
        <ellipse cx="86" cy="66" rx="28" ry="30" fill="url(#lihua-fur)"/>
        <g fill="none" stroke="#3a2418" stroke-width="3.2" stroke-linecap="round">
          <path d="M72 50 q0 20 0 34"/>
          <path d="M86 48 q0 22 0 38"/>
          <path d="M100 50 q0 20 0 34"/>
          <path d="M78 58 q0 12 0 18" stroke-width="2"/>
          <path d="M94 58 q0 12 0 18" stroke-width="2"/>
        </g>
        <ellipse cx="86" cy="92" rx="16" ry="7" fill="#efe8dc" opacity="0.75"/>
        <circle cx="86" cy="34" r="17" fill="url(#lihua-fur-dark)"/>
        <path d="M74 30 L70 12 L86 26 Z" fill="#a67d45"/>
        <path d="M98 30 L104 12 L88 26 Z" fill="#a67d45"/>
        <path d="M76 22 L86 28 L96 22" fill="none" stroke="#2e1c12" stroke-width="2"/>
        <path class="pet-tail-curl" d="M58 74 C28 62 24 94 62 92" fill="none" stroke="#3a2418" stroke-width="8" stroke-linecap="round"/>
        <path d="M58 74 C28 62 24 94 62 92" fill="none" stroke="#b8955c" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
    <span class="pet-name" id="pet-name-tag"></span>
  </aside>

  <div id="name-slip" class="name-slip" hidden>
    <p>第一次见到它。要起个名字吗。</p>
    <input id="pet-name-input" type="text" maxlength="8" placeholder="可不填" autocomplete="off" lang="zh-CN" inputmode="text" spellcheck="false">
    <button type="button" class="btn primary" id="btn-name-ok">就叫这个</button>
    <button type="button" class="btn ghost" id="btn-name-skip">跳过</button>
  </div>

  <div id="share-sheet" class="share-sheet" hidden>
    <p class="share-sheet-title">今晚的账单</p>
    <p class="share-sheet-copy">对象和感觉打成 ████。没有排行榜。</p>
    <button type="button" class="btn primary" id="btn-share-native">分享</button>
    <button type="button" class="btn ghost" id="btn-share-copy">复制文案</button>
    <button type="button" class="btn ghost" id="btn-share-download">下载图片</button>
    <button type="button" class="btn ghost" id="btn-share-close">关闭</button>
    <p class="fine" id="share-status" role="status"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
