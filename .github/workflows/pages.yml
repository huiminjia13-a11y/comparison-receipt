name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          cp index.html app.js styles.css .nojekyll stats.html stats.json _site/

      - name: Refresh stats.json from Abacus (best effort)
        env:
          NS: huiminjia13-comparison-receipt
          BASE: https://abacus.jasoncameron.dev
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          NS = os.environ["NS"]
          BASE = os.environ["BASE"].rstrip("/")
          keys = [
              ("opens", None),
              ("prints", None),
              ("emo-suan", "酸"),
              ("emo-bufu", "不服"),
              ("emo-xiang", "想"),
              ("emo-qi", "气"),
              ("emo-kong", "空"),
              ("emo-qita", "其他"),
          ]

          def get_value(key: str) -> int | None:
              url = f"{BASE}/get/{NS}/{key}"
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "comparison-receipt-stats-mirror"})
                      with urllib.request.urlopen(req, timeout=8) as res:
                          data = json.load(res)
                          return int(data.get("value") or 0)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      if e.code == 404 or "not found" in body.lower():
                          return 0
                  except Exception as e:
                      print(f"warn {key}: {e}")
                  time.sleep(1 + attempt)
              return None

          opens = get_value("opens")
          prints = get_value("prints")
          if opens is None or prints is None:
              print("Abacus unreachable; keeping committed stats.json")
              raise SystemExit(0)

          emotions = {}
          for key, label in keys:
              if label is None:
                  continue
              n = get_value(key)
              emotions[label] = 0 if n is None else n

          data = {
              "namespace": NS,
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "abacus",
              "opens": opens,
              "prints": prints,
              "emotions": emotions,
              "note": "Anonymous lifetime totals only. No ticket content. Abacus remains source of truth for increments.",
          }
          with open("_site/stats.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
