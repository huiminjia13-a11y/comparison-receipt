name: Sync Abacus stats mirror

# Mirrors anonymous Abacus totals into same-origin stats.json on main.
# GitHub Pages for this repo currently serves from main (not gh-pages),
# so the China-reachable stats page reads this committed file.

on:
  schedule:
    # GitHub may delay cron; still enough for owner-facing totals.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stats
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch Abacus counters → stats.json
        env:
          NS: huiminjia13-comparison-receipt
          BASE: https://abacus.jasoncameron.dev
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          NS = os.environ["NS"]
          BASE = os.environ["BASE"].rstrip("/")
          path = Path("stats.json")
          prev = {}
          if path.exists():
              try:
                  prev = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  prev = {}
          prev_emotions = prev.get("emotions") if isinstance(prev.get("emotions"), dict) else {}

          keys = [
              ("opens", None),
              ("prints", None),
              ("emo-suan", "酸"),
              ("emo-bufu", "不服"),
              ("emo-xiang", "想"),
              ("emo-qi", "气"),
              ("emo-kong", "空"),
              ("emo-qita", "其他"),
          ]

          def get_value(key: str):
              url = f"{BASE}/get/{NS}/{key}"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "comparison-receipt-stats-mirror"})
                      with urllib.request.urlopen(req, timeout=8) as res:
                          data = json.load(res)
                          return int(data.get("value") or 0)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      if e.code == 404 or "not found" in body.lower():
                          return 0
                      print(f"warn {key} HTTP {e.code}: {body[:120]}")
                  except Exception as e:
                      print(f"warn {key}: {e}")
                  time.sleep(1 + attempt)
              print(f"WARN: failed to read {key}")
              return None

          opens = get_value("opens")
          prints = get_value("prints")
          if opens is None:
              opens = int(prev.get("opens") or 0)
              print(f"keeping previous opens={opens}")
          if prints is None:
              prints = int(prev.get("prints") or 0)
              print(f"keeping previous prints={prints}")

          emotions = {}
          for key, label in keys:
              if label is None:
                  continue
              n = get_value(key)
              if n is None:
                  n = int(prev_emotions.get(label) or 0)
                  print(f"keeping previous {label}={n}")
              emotions[label] = n

          data = {
              "namespace": NS,
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "abacus",
              "opens": opens,
              "prints": prints,
              "emotions": emotions,
              "note": "Anonymous lifetime totals only. No ticket content. Abacus remains source of truth for increments.",
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit stats.json to main when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "stats.json unchanged"
            exit 0
          fi
          git commit -m "chore: mirror Abacus stats.json for China-reachable page"
          git push origin HEAD:main
