name: Sync Abacus stats mirror

# Periodically mirrors anonymous Abacus totals into same-origin stats.json on
# gh-pages so the China-reachable stats page does not call abacus.jasoncameron.dev.

on:
  schedule:
    # GitHub may delay cron; still enough for owner-facing totals.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stats
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Abacus counters → stats.json
        env:
          NS: huiminjia13-comparison-receipt
          BASE: https://abacus.jasoncameron.dev
        run: |
          set -euo pipefail
          mkdir -p _mirror
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          NS = os.environ["NS"]
          BASE = os.environ["BASE"].rstrip("/")
          keys = [
              ("opens", None),
              ("prints", None),
              ("emo-suan", "酸"),
              ("emo-bufu", "不服"),
              ("emo-xiang", "想"),
              ("emo-qi", "气"),
              ("emo-kong", "空"),
              ("emo-qita", "其他"),
          ]

          def get_value(key: str) -> int:
              url = f"{BASE}/get/{NS}/{key}"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "comparison-receipt-stats-mirror"})
                      with urllib.request.urlopen(req, timeout=8) as res:
                          data = json.load(res)
                          return int(data.get("value") or 0)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      if e.code == 404 or "not found" in body.lower():
                          return 0
                      print(f"warn {key} HTTP {e.code}: {body[:120]}")
                  except Exception as e:
                      print(f"warn {key}: {e}")
                  time.sleep(1 + attempt)
              print(f"WARN: failed to read {key}; defaulting to 0")
              return 0

          opens = get_value("opens")
          prints = get_value("prints")
          emotions = {}
          for key, label in keys:
              if label is None:
                  continue
              emotions[label] = get_value(key)

          data = {
              "namespace": NS,
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "abacus",
              "opens": opens,
              "prints": prints,
              "emotions": emotions,
              "note": "Anonymous lifetime totals only. No ticket content. Abacus remains source of truth for increments.",
          }
          with open("_mirror/stats.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Publish stats.json to gh-pages (keep other site files)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_mirror
          destination_dir: .
          keep_files: true
          force_orphan: false
          enable_jekyll: false
          commit_message: "chore: mirror Abacus stats.json for China-reachable page"
